{{ define "main" }}
<section class="hero"><p class="eyebrow">{{ site.Params.author }}</p><h1>记录值得留下的想法。</h1><p>{{ site.Params.description }}</p></section>
<h2>最新文章</h2>
{{ range where site.RegularPages "Section" "posts" }}
<article class="post-card"><time>{{ .Date.Format "2006-01-02" }}</time><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>{{ with .Description }}<p>{{ . }}</p>{{ end }}</article>
{{ end }}
{{ end }}
