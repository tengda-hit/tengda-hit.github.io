{{ define "main" }}<div class="article"><h1>搜索文章</h1><input id="search" class="search-box" type="search" placeholder="输入关键词…"><div id="results"></div></div><script>fetch('{{ "index.json" | relURL }}').then(r=>r.json()).then(posts=>{const input=document.querySelector('#search'),out=document.querySelector('#results');function render(){const q=input.value.trim().toLowerCase();out.innerHTML=posts.filter(p=>!q||(`${p.title} ${p.content}`.toLowerCase().includes(q))).map(p=>`<article class="post-card"><h3><a href="${p.permalink}">${p.title}</a></h3><p>${p.summary||''}</p></article>`).join('')||'<p class="muted">没有找到相关文章。</p>'}input.addEventListener('input',render);render()})</script>{{ end }}
