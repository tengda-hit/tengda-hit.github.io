{{ define "main" }}<article class="article"><p class="eyebrow">{{ .Date.Format "2006-01-02" }}</p><h1>{{ .Title }}</h1>{{ .Content }}<div class="terms">{{ range .Params.categories }}<a href="{{ "categories/" | relURL }}{{ . | urlize }}/">分类：{{ . }}</a>{{ end }}{{ range .Params.tags }}<a href="{{ "tags/" | relURL }}{{ . | urlize }}/">#{{ . }}</a>{{ end }}</div><hr><h2>评论</h2>{{ if site.Params.giscusRepoId }}<script src="https://giscus.app/client.js" data-repo="{{ site.Params.giscusRepo }}" data-repo-id="{{ site.Params.giscusRepoId }}" data-category="{{ site.Params.giscusCategory }}" data-category-id="{{ site.Params.giscusCategoryId }}" data-mapping="pathname" data-reactions-enabled="1" data-emit-metadata="0" data-input-position="top" data-theme="light" crossorigin="anonymous" async></script>{{ else }}<p class="muted">评论功能已预留。完成 Giscus 配置后，这里会显示评论区。</p>{{ end }}</article>{{ end }}
